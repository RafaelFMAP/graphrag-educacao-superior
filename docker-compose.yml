name: graphrag-educacao-superior
x-app: &app
  build: .
  environment: &environment
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphrag_demo}
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphrag_demo}
      # Graph Data Science (PageRank, Leiden/Louvain); baixado na primeira inicialização
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" 'RETURN 1'
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  models:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-ec"]
    command: ['ollama pull "$$OLLAMA_MODEL"; ollama pull "$$OLLAMA_EMBED_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
  seed:
    <<: *app
    command: ["python", "seed.py"]
    healthcheck:
      disable: true
    depends_on:
      neo4j:
        condition: service_healthy
      models:
        condition: service_completed_successfully
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
  tests:
    <<: *app
    profiles: ["test"]
    command: ["python", "-m", "pytest", "-q"]
    healthcheck:
      disable: true
volumes:
  neo4j_data:
  ollama_data:
